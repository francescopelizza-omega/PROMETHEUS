# electron-builder.yml — per-OS packaging for Prometheus Studio (file 10 §2).
#
# RECONCILED to electron-vite's real output: the build emits apps/desktop/out/
# {main,preload,renderer} (NOT dist/), so `files` packs out/**. The engine + the
# relocatable CPython ride as extraResources (real files on disk, NOT in asar — a
# child python must be able to exec them, §1), filled by scripts/stage-engine.mjs +
# scripts/fetch-pyruntime.mjs into ../../staging/ before electron-builder runs.
appId: ai.prometheus.studio
productName: Prometheus Studio
copyright: © 2026 Francesco Pelizza
# App icon (HANDOFF_2 §8): the pixel-art human Prometheus. The single SOURCE is the
# master artwork; build/icon.{png,icns,ico} are GENERATED and committed. Regenerate with
#   node scripts/build-app-icon.mjs [path/to/master.png]
# which keys out the master's baked-in background, upscales by integer nearest-neighbour
# (pixel art must never be bilinear-filtered), centres it on the #0d0d0d ground, and
# emits the 1024² PNG + the macOS .icns (via iconutil) + the Windows .ico. It also writes
# the in-app 19×21 mark to renderer/assets/. electron-builder reads build/ as
# buildResources by convention; the dev run loads the same PNG for its dock/window icon
# (see main/index.ts APP_ICON_PATH). Do NOT hand-edit the generated files.
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - package.json
asar: true
# node-pty is N-API (ABI-stable across Electron versions) and ships a prebuilt binary — do
# NOT let electron-builder auto-run @electron/rebuild on it (the plan's node-pty gotcha). The
# rebuild also breaks on Python 3.12 (node-gyp 9.x → removed `distutils`); N-API needs none.
npmRebuild: false
asarUnpack:
  # native .node addons (node-pty for the terminal, file 07) must be unpacked so a child
  # process can exec them; the whole dir is unpacked, and the spawn-helper + *.node are
  # called out explicitly (APP-068) so afterPack can re-chmod the exec bit electron-builder
  # strips during asar packing (build/after-pack.cjs).
  - "**/node_modules/node-pty/**"
  - "**/node_modules/node-pty/build/Release/spawn-helper"
  - "**/node_modules/node-pty/build/Release/*.node"
# after every per-OS pack: restore the node-pty spawn-helper's 0755 exec bit inside
# app.asar.unpacked (asar packing drops it → "No terminal backend" in the packaged app).
afterPack: build/after-pack.cjs
extraResources:
  # §1 — engine + python runtime ride alongside, NOT in asar.
  - from: ../../staging/engine
    to: engine
    filter: ["**/*"]
  - from: ../../staging/pyruntime/${os}-${arch}
    to: pyruntime
    filter: ["**/*"]
mac:
  category: public.app-category.developer-tools
  hardenedRuntime: true # required for notarization
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: false # notarized in CI via the afterSign hook (build/notarize.cjs, §4.1)
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip # electron-updater consumes the zip on mac
      arch: [arm64, x64]
afterSign: build/notarize.cjs
linux:
  category: Development
  maintainer: Francesco Pelizza <red-beard-phoenix@users.noreply.gitlab.com>
  target:
    - target: AppImage # primary, self-updating (zsync delta)
      arch: [x64, arm64]
    - target: deb
      arch: [x64, arm64]
  desktop:
    StartupWMClass: prometheus-studio
win:
  target:
    - target: nsis
      # x64 only: the pinned CPython release (20240909) has no win-arm64 runtime (see
      # pyruntime.lock.json) — re-add arm64 when a newer release publishes that triple.
      arch: [x64]
  signtoolOptions:
    signingHashAlgorithms: [sha256]
nsis:
  oneClick: false
  perMachine: false # per-user → no UAC, easier auto-update
  allowToChangeInstallationDirectory: true
  shortcutName: Prometheus Studio
# PUBLISHING IS DELIBERATELY UNCONFIGURED.
#
# This block pointed at `provider: github, owner: <a personal github account>, repo: prometheus`
# — a GitHub repository, while this project's remote is GitLab
# (gitlab.com/red-beard-phoenix/PROMETHEUS). Two things were wrong with that, and the second is
# the serious one:
#
#   1. It could never have worked: `electron-builder --publish` would authenticate against a
#      GitHub repo that is not this project's, and the auto-updater would have pointed users at
#      releases that were never going to appear there.
#   2. A misconfigured publish target is a loaded gun. `pnpm run package` passes
#      `--publish never`, so nothing has fired — but any invocation that did not would have
#      attempted an upload to somebody else's namespace.
#
# The packaging path (`pnpm --filter @prometheus/desktop run package`) is unaffected: it builds
# a local artifact and explicitly does not publish. Restore a `publish:` block only alongside a
# real release process, pointing at the forge this project actually uses — and note that
# electron-builder has no first-class GitLab provider, so that will mean `provider: generic`
# with a release URL, or GitLab's package registry.
#
# The auto-updater reads the same block; leaving it wrong meant update checks against a
# stranger's repository.
