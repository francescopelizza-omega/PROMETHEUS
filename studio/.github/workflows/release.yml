# studio-release — publish a GitHub Release after build is green (file 10 §5/§7).
#
# Runs after studio-build succeeds on all OS for a v* tag: downloads the per-OS
# artifacts, GPG-detach-signs the Linux AppImage/.deb + writes SHA256SUMS (§4.3), and
# creates the GitHub Release with every installer + latest*.yml (electron-updater
# feed) + the checksums + signatures. Channel = stable/beta/alpha per the tag shape
# (§5); a stable release ships at a staged rollout %.
name: studio-release

on:
  workflow_run:
    workflows: ["studio-build"]
    types: [completed]

permissions:
  contents: write

defaults:
  run:
    working-directory: PROMETHEUS/studio

jobs:
  release:
    name: publish release
    if: ${{ github.event.workflow_run.conclusion == 'success' && startsWith(github.event.workflow_run.head_branch, 'v') }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: PROMETHEUS/studio/release
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          merge-multiple: true

      - name: Determine channel from tag (§5)
        id: chan
        run: |
          TAG="${{ github.event.workflow_run.head_branch }}"
          if echo "$TAG" | grep -q -- '-beta\.'; then echo "channel=beta" >> "$GITHUB_OUTPUT";
          elif echo "$TAG" | grep -q -- '-alpha\.'; then echo "channel=alpha" >> "$GITHUB_OUTPUT";
          else echo "channel=latest" >> "$GITHUB_OUTPUT"; fi

      - name: SHA256SUMS + GPG detached signatures (Linux artifacts, §4.3)
        run: |
          cd release
          shopt -s nullglob
          files=(*.AppImage *.deb *.dmg *.zip *.exe)
          if [ ${#files[@]} -gt 0 ]; then sha256sum "${files[@]}" > SHA256SUMS; fi
          if [ -n "${{ secrets.GPG_PRIVATE_KEY }}" ]; then
            echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --batch --import
            for f in *.AppImage *.deb; do
              [ -f "$f" ] && gpg --batch --yes --pinentry-mode loopback \
                --passphrase "${{ secrets.GPG_PASSPHRASE }}" --detach-sign --armor "$f"
            done
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.workflow_run.head_branch }}
          prerelease: ${{ steps.chan.outputs.channel != 'latest' }}
          generate_release_notes: true
          files: |
            PROMETHEUS/studio/release/*.dmg
            PROMETHEUS/studio/release/*.zip
            PROMETHEUS/studio/release/*.AppImage
            PROMETHEUS/studio/release/*.deb
            PROMETHEUS/studio/release/*.exe
            PROMETHEUS/studio/release/latest*.yml
            PROMETHEUS/studio/release/SHA256SUMS
            PROMETHEUS/studio/release/*.asc
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
