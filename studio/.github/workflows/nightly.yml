# studio-nightly — packaged-smoke e2e + self-scan + dep audit (file 10 §6.5/§7).
#
# Cron: build the dev bundles, run the Playwright _electron smoke set against them on
# all 3 OS (catches path/asar regressions), nemesis-self-scan the engine + sidecar,
# and osv-scan the pnpm lockfile. Non-release; informational + early-warning.
name: studio-nightly

on:
  schedule:
    - cron: "0 6 * * *" # 06:00 UTC daily
  workflow_dispatch:

defaults:
  run:
    working-directory: PROMETHEUS/studio

env:
  PROMETHEUS_PY: ${{ github.workspace }}/PROMETHEUS/prometheus.py

jobs:
  e2e-packaged:
    name: e2e smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-22.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: PROMETHEUS/studio/.nvmrc
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # pnpm version follows the `packageManager` field (pnpm@10.x) — no second pin.
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @prometheus/desktop run build
      - name: Playwright e2e (dev build smoke)
        run: |
          pnpm exec playwright install --with-deps chromium || true
          if [ "${{ runner.os }}" = "Linux" ]; then
            xvfb-run -a pnpm exec playwright test -c tests/playwright.config.ts --project e2e-dev
          else
            pnpm exec playwright test -c tests/playwright.config.ts --project e2e-dev
          fi
        shell: bash

  self-scan:
    name: nemesis self-scan + dependency audit
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version-file: PROMETHEUS/studio/.nvmrc
      - uses: pnpm/action-setup@v4
      - name: nemesis self-scan (the engine eats its own dog food, §3.1)
        run: python3 "$PROMETHEUS_PY" --json scan
      - name: osv-scanner on the pnpm lockfile
        uses: google/osv-scanner-action@v1
        with:
          scan-args: "--lockfile=PROMETHEUS/studio/pnpm-lock.yaml"
        continue-on-error: true
